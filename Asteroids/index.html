<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroids</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    canvas.width = 800;
    canvas.height = 600;

    // --- Constants ---
    const SHIP_SIZE = 15;
    const TURN_SPEED = 0.07;
    const THRUST = 0.12;
    const FRICTION = 0.99;
    const BULLET_SPEED = 7;
    const BULLET_LIFE = 60;
    const SHOOT_COOLDOWN = 10;
    const MAX_ASTEROIDS_START = 5;
    const ASTEROID_SPEED = 1.5;
    const INVINCIBLE_TIME = 120;
    const RESPAWN_DELAY = 90;

    // --- Audio ---
    let audioCtx;
    function ensureAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playShoot() {
        ensureAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function playExplosion(size) {
        ensureAudio();
        const duration = 0.2 + size * 0.15;
        const bufferSize = audioCtx.sampleRate * duration;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
        }
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        // Tiefpass für dumpferen Klang bei grossen Asteroiden
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800 + (3 - size) * 600, audioCtx.currentTime);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.2 + size * 0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        source.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        source.start();
    }

    function playShipExplosion() {
        ensureAudio();
        const duration = 0.8;
        const bufferSize = audioCtx.sampleRate * duration;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.5);
        }
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(600, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + duration);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        source.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        source.start();
    }

    let thrustOsc = null, thrustGain = null;
    function startThrust() {
        if (thrustOsc) return;
        ensureAudio();
        thrustOsc = audioCtx.createOscillator();
        thrustGain = audioCtx.createGain();
        thrustOsc.type = 'sawtooth';
        thrustOsc.frequency.setValueAtTime(60, audioCtx.currentTime);
        thrustGain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        // Leichtes Wackeln für Motorengeräusch
        const lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        lfo.frequency.setValueAtTime(12, audioCtx.currentTime);
        lfoGain.gain.setValueAtTime(15, audioCtx.currentTime);
        lfo.connect(lfoGain);
        lfoGain.connect(thrustOsc.frequency);
        lfo.start();
        thrustOsc._lfo = lfo;
        thrustOsc.connect(thrustGain);
        thrustGain.connect(audioCtx.destination);
        thrustOsc.start();
    }
    function stopThrust() {
        if (!thrustOsc) return;
        thrustOsc._lfo.stop();
        thrustOsc.stop();
        thrustOsc = null;
        thrustGain = null;
    }

    // Hintergrund-Beat (wie im Original: tiefes Pulsieren)
    let beatInterval = null;
    let beatToggle = false;
    function startBeat() {
        stopBeat();
        beatTick();
        updateBeatSpeed();
    }
    function stopBeat() {
        if (beatInterval) { clearTimeout(beatInterval); beatInterval = null; }
    }
    function beatTick() {
        if (!audioCtx || gameOver || !gameStarted) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(beatToggle ? 55 : 50, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
        beatToggle = !beatToggle;
        updateBeatSpeed();
    }
    function updateBeatSpeed() {
        // Beat wird schneller je weniger Asteroiden
        const count = asteroids ? asteroids.length : 10;
        const speed = Math.max(150, 600 - (10 - Math.min(count, 10)) * 45);
        beatInterval = setTimeout(beatTick, speed);
    }

    function playLevelUp() {
        ensureAudio();
        const notes = [440, 554, 659, 880];
        notes.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.1);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.1 + 0.15);
            osc.start(audioCtx.currentTime + i * 0.1);
            osc.stop(audioCtx.currentTime + i * 0.1 + 0.15);
        });
    }

    function playGameOver() {
        ensureAudio();
        const notes = [440, 370, 311, 220];
        notes.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.25);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.25);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.25 + 0.3);
            osc.start(audioCtx.currentTime + i * 0.25);
            osc.stop(audioCtx.currentTime + i * 0.25 + 0.3);
        });
    }

    // --- Game State ---
    let ship, bullets, asteroids, particles, score, lives, level, gameOver, gameStarted;
    let invincibleTimer, respawnTimer, shootCooldown;
    let highScore = parseInt(localStorage.getItem('asteroids_high') || '0');

    const keys = {};

    function init() {
        ship = createShip();
        bullets = [];
        asteroids = [];
        particles = [];
        score = 0;
        lives = 3;
        level = 1;
        gameOver = false;
        gameStarted = false;
        invincibleTimer = 0;
        respawnTimer = 0;
        shootCooldown = 0;
        spawnAsteroids(MAX_ASTEROIDS_START);
    }

    function createShip() {
        return {
            x: canvas.width / 2,
            y: canvas.height / 2,
            angle: -Math.PI / 2,
            dx: 0,
            dy: 0,
            thrusting: false,
            alive: true
        };
    }

    function spawnAsteroids(count) {
        for (let i = 0; i < count; i++) {
            let x, y;
            do {
                x = Math.random() * canvas.width;
                y = Math.random() * canvas.height;
            } while (dist(x, y, ship.x, ship.y) < 150);
            asteroids.push(createAsteroid(x, y, 3));
        }
    }

    function createAsteroid(x, y, size) {
        const angle = Math.random() * Math.PI * 2;
        const speed = ASTEROID_SPEED * (4 - size) * 0.5 + Math.random() * 0.5;
        // Unregelmässige Form
        const vertices = [];
        const numVerts = 8 + Math.floor(Math.random() * 5);
        for (let i = 0; i < numVerts; i++) {
            const a = (i / numVerts) * Math.PI * 2;
            const r = (0.7 + Math.random() * 0.3);
            vertices.push({ angle: a, r });
        }
        return {
            x, y,
            dx: Math.cos(angle) * speed,
            dy: Math.sin(angle) * speed,
            size,
            radius: size * 18,
            vertices,
            rotAngle: 0,
            rotSpeed: (Math.random() - 0.5) * 0.02
        };
    }

    function dist(x1, y1, x2, y2) {
        return Math.hypot(x1 - x2, y1 - y2);
    }

    // --- Update ---
    function update() {
        if (gameOver) return;
        if (!gameStarted) return;

        // Ship controls
        if (ship.alive) {
            if (keys['ArrowLeft']) ship.angle -= TURN_SPEED;
            if (keys['ArrowRight']) ship.angle += TURN_SPEED;
            const wasThrusting = ship.thrusting;
            ship.thrusting = !!keys['ArrowUp'];
            if (ship.thrusting && !wasThrusting) startThrust();
            if (!ship.thrusting && wasThrusting) stopThrust();
            if (ship.thrusting) {
                ship.dx += Math.cos(ship.angle) * THRUST;
                ship.dy += Math.sin(ship.angle) * THRUST;
            }
            ship.dx *= FRICTION;
            ship.dy *= FRICTION;
            ship.x += ship.dx;
            ship.y += ship.dy;
            wrap(ship);

            if (shootCooldown > 0) shootCooldown--;
            if (keys[' '] && shootCooldown <= 0) {
                bullets.push({
                    x: ship.x + Math.cos(ship.angle) * SHIP_SIZE,
                    y: ship.y + Math.sin(ship.angle) * SHIP_SIZE,
                    dx: Math.cos(ship.angle) * BULLET_SPEED + ship.dx * 0.3,
                    dy: Math.sin(ship.angle) * BULLET_SPEED + ship.dy * 0.3,
                    life: BULLET_LIFE
                });
                shootCooldown = SHOOT_COOLDOWN;
                playShoot();
            }

            if (invincibleTimer > 0) invincibleTimer--;
        } else {
            if (respawnTimer > 0) {
                respawnTimer--;
            } else if (lives > 0) {
                ship = createShip();
                invincibleTimer = INVINCIBLE_TIME;
            } else {
                gameOver = true;
                stopBeat();
                playGameOver();
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('asteroids_high', highScore.toString());
                }
            }
        }

        // Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.dx;
            b.y += b.dy;
            wrap(b);
            b.life--;
            if (b.life <= 0) bullets.splice(i, 1);
        }

        // Asteroids
        for (const a of asteroids) {
            a.x += a.dx;
            a.y += a.dy;
            a.rotAngle += a.rotSpeed;
            wrap(a);
        }

        // Collision: bullets vs asteroids
        for (let i = bullets.length - 1; i >= 0; i--) {
            for (let j = asteroids.length - 1; j >= 0; j--) {
                if (dist(bullets[i].x, bullets[i].y, asteroids[j].x, asteroids[j].y) < asteroids[j].radius) {
                    // Explosion particles + sound
                    playExplosion(asteroids[j].size);
                    spawnExplosion(asteroids[j].x, asteroids[j].y, 8);
                    // Split
                    if (asteroids[j].size > 1) {
                        asteroids.push(createAsteroid(asteroids[j].x, asteroids[j].y, asteroids[j].size - 1));
                        asteroids.push(createAsteroid(asteroids[j].x, asteroids[j].y, asteroids[j].size - 1));
                    }
                    score += [0, 100, 50, 20][asteroids[j].size];
                    asteroids.splice(j, 1);
                    bullets.splice(i, 1);
                    break;
                }
            }
        }

        // Collision: ship vs asteroids
        if (ship.alive && invincibleTimer <= 0) {
            for (let j = asteroids.length - 1; j >= 0; j--) {
                if (dist(ship.x, ship.y, asteroids[j].x, asteroids[j].y) < asteroids[j].radius + SHIP_SIZE * 0.6) {
                    ship.alive = false;
                    lives--;
                    respawnTimer = RESPAWN_DELAY;
                    stopThrust();
                    playShipExplosion();
                    spawnExplosion(ship.x, ship.y, 20);
                    break;
                }
            }
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.dx;
            p.y += p.dy;
            p.life--;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Next level
        if (asteroids.length === 0) {
            level++;
            playLevelUp();
            spawnAsteroids(MAX_ASTEROIDS_START + level - 1);
        }
    }

    function wrap(obj) {
        if (obj.x < 0) obj.x += canvas.width;
        if (obj.x > canvas.width) obj.x -= canvas.width;
        if (obj.y < 0) obj.y += canvas.height;
        if (obj.y > canvas.height) obj.y -= canvas.height;
    }

    function spawnExplosion(x, y, count) {
        for (let i = 0; i < count; i++) {
            const a = Math.random() * Math.PI * 2;
            const s = Math.random() * 3 + 1;
            particles.push({
                x, y,
                dx: Math.cos(a) * s,
                dy: Math.sin(a) * s,
                life: 20 + Math.random() * 20
            });
        }
    }

    // --- Draw ---
    function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (!gameStarted) {
            drawTitleScreen();
            return;
        }

        // Ship
        if (ship.alive) {
            const blink = invincibleTimer > 0 && Math.floor(invincibleTimer / 5) % 2;
            if (!blink) {
                ctx.save();
                ctx.translate(ship.x, ship.y);
                ctx.rotate(ship.angle);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(SHIP_SIZE, 0);
                ctx.lineTo(-SHIP_SIZE * 0.8, -SHIP_SIZE * 0.7);
                ctx.lineTo(-SHIP_SIZE * 0.4, 0);
                ctx.lineTo(-SHIP_SIZE * 0.8, SHIP_SIZE * 0.7);
                ctx.closePath();
                ctx.stroke();

                // Schub-Flamme
                if (ship.thrusting && Math.random() > 0.3) {
                    ctx.strokeStyle = '#f80';
                    ctx.beginPath();
                    ctx.moveTo(-SHIP_SIZE * 0.5, -SHIP_SIZE * 0.3);
                    ctx.lineTo(-SHIP_SIZE * (0.9 + Math.random() * 0.6), 0);
                    ctx.lineTo(-SHIP_SIZE * 0.5, SHIP_SIZE * 0.3);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        // Bullets
        ctx.fillStyle = '#fff';
        for (const b of bullets) {
            ctx.beginPath();
            ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // Asteroids
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        for (const a of asteroids) {
            ctx.save();
            ctx.translate(a.x, a.y);
            ctx.rotate(a.rotAngle);
            ctx.beginPath();
            for (let i = 0; i < a.vertices.length; i++) {
                const v = a.vertices[i];
                const px = Math.cos(v.angle) * v.r * a.radius;
                const py = Math.sin(v.angle) * v.r * a.radius;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }

        // Particles
        for (const p of particles) {
            const alpha = p.life / 40;
            ctx.fillStyle = `rgba(255, 200, 100, ${alpha})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // HUD
        ctx.fillStyle = '#fff';
        ctx.font = '20px "Courier New", monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`PUNKTE: ${score}`, 15, 30);
        ctx.textAlign = 'right';
        ctx.fillText(`LEVEL: ${level}`, canvas.width - 15, 30);

        // Lives as small ships
        for (let i = 0; i < lives; i++) {
            const lx = 25 + i * 25;
            const ly = 55;
            ctx.save();
            ctx.translate(lx, ly);
            ctx.rotate(-Math.PI / 2);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(8, 0);
            ctx.lineTo(-6, -5);
            ctx.lineTo(-3, 0);
            ctx.lineTo(-6, 5);
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }

        // High Score
        ctx.fillStyle = '#888';
        ctx.font = '14px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`HIGHSCORE: ${highScore}`, canvas.width / 2, 20);

        // Game Over
        if (gameOver) {
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 48px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
            ctx.font = '20px "Courier New", monospace';
            ctx.fillText(`ENDPUNKTZAHL: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
            ctx.font = '16px "Courier New", monospace';
            ctx.fillStyle = '#aaa';
            ctx.fillText('ENTER drücken für neues Spiel', canvas.width / 2, canvas.height / 2 + 60);
        }
    }

    function drawTitleScreen() {
        // Asteroids still move on title screen
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        for (const a of asteroids) {
            a.x += a.dx;
            a.y += a.dy;
            a.rotAngle += a.rotSpeed;
            wrap(a);
            ctx.save();
            ctx.translate(a.x, a.y);
            ctx.rotate(a.rotAngle);
            ctx.beginPath();
            for (let i = 0; i < a.vertices.length; i++) {
                const v = a.vertices[i];
                const px = Math.cos(v.angle) * v.r * a.radius;
                const py = Math.sin(v.angle) * v.r * a.radius;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 60px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('ASTEROIDS', canvas.width / 2, canvas.height / 2 - 60);

        ctx.font = '18px "Courier New", monospace';
        ctx.fillStyle = '#aaa';
        ctx.fillText('← → DREHEN    ↑ SCHUB    LEERTASTE SCHIESSEN', canvas.width / 2, canvas.height / 2 + 10);

        // Blinkender Text
        if (Math.floor(Date.now() / 500) % 2) {
            ctx.fillStyle = '#fff';
            ctx.font = '22px "Courier New", monospace';
            ctx.fillText('ENTER drücken zum Starten', canvas.width / 2, canvas.height / 2 + 60);
        }

        if (highScore > 0) {
            ctx.fillStyle = '#888';
            ctx.font = '16px "Courier New", monospace';
            ctx.fillText(`HIGHSCORE: ${highScore}`, canvas.width / 2, canvas.height / 2 + 110);
        }
    }

    // --- Input ---
    document.addEventListener('keydown', e => {
        keys[e.key] = true;
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
            e.preventDefault();
        }
        if (e.key === 'Enter') {
            ensureAudio();
            if (!gameStarted) {
                gameStarted = true;
                startBeat();
            } else if (gameOver) {
                init();
                gameStarted = true;
                startBeat();
            }
        }
    });
    document.addEventListener('keyup', e => {
        keys[e.key] = false;
    });

    // --- Game Loop ---
    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    init();
    loop();
    </script>
</body>
</html>
